[Main]
; Loading screen mode (also editable in-game via MCM)
;   0 = Black screen          - black, no background, no tips
;   1 = Native (no 3D)        - game's native loading screen, tips/level visible
;   2 = Background            - concept art background, no tips
;   3 = Background + Tips     - concept art background with captured tips/level (default)
iLoadingScreenMode=3

; Hidden release arm used by the benchmark harness. This is intentionally not
; an in-game MCM control because patches/hooks are selected during startup.
;   0 = passive measurement observer (timestamps only; no hooks, patches,
;       custom visuals, workers, preload systems, fades, spinner edits, or MoveTo)
;   1 = full plugin (default)
; Requires a full game restart when changed.
iBenchmarkMode=1

; Read-only save-file cache warm while a main-menu confirmation popup is open.
; The below-normal-priority worker reads at most 128 MiB for 2.5 seconds. It
; cancels before Fallout's real load and waits at most 250 ms at hand-off; the
; engine then continues even if Windows is still completing cancellation. The
; plugin never deserializes the save or changes engine save/load state.
;   0 = off
;   1 = on (default; OG 1.10.163 and VR 1.2.72; AE/NG fails closed)
bPreloadSaveOnConfirm=1

; ---------------------------------------------------------------------------
; Fades and scene-settle
; ---------------------------------------------------------------------------
; These values do not change how much cell/save data Fallout must load. They do
; control fade and post-load settle time, however, so they can change the total
; visible transition and can affect a timing whose boundary includes that phase.
; Keep one fade policy unchanged across runs for comparable measurements.

; Master fade style.
;   0 = trimmed  - use the individual values below
;   1 = vanilla  - restore values captured from this runtime/INI at startup (default)
bVanillaFades=1

; Scene-settle buffer, in seconds (engine "fMinSecondsForLoadFadeIn", vanilla 1.5).
; The cells finish loading first; this then holds the world behind the fade-in
; for that long while the scene settles (NPC poses, animations) so you don't see
; pop-in on entry. It does not request more cell data, but it intentionally
; extends the reveal/settle phase. Used only when bVanillaFades=0; vanilla mode
; restores the value captured before this plugin's first custom write.
;   1.5    = vanilla, no pop-in (recommended)
;   0.0001 = world appears instantly, but NPCs/anims may snap into place
fMinSecondsForLoadFadeIn=1.5

; Individual fade-animation durations, in seconds (used only when
; bVanillaFades=0). Lower values are an opt-in visual/timing change, not a
; cell-loading optimization. Vanilla mode ignores these and restores the
; runtime/INI-specific startup snapshot.
fLoadGameFadeSecs=1.0
fFadeToBlackFadeSeconds=1.0
fAutoDoorFadeSecs=0.5
fNormalDoorFadeSecs=0.4
fNormalDoorFadeWait=0.01

[DoorPrefetch]
; Internal release policy, intentionally not exposed in MCM. Automatically
; preload nearby load gates whose destination is in another exterior worldspace.
; The Diamond City/Commonwealth gate is the primary diagnostic target. It scans
; only already-loaded door references and does not cast a Havok ray.
;   0 = off
;   1 = on
bPreloadExteriorGates=1

; Internal exterior-gate proximity distance selector:
;   0 = 1 cell / 4096 units (default)
;   1 = 2 cells, 2 = 3 cells, 3 = 4 cells
iExteriorGateDistanceCells=0

; Speculative interior preloading is retired. Full mode always forces the
; engine's bPreloadLinkedAreas setting off and ignores the removed legacy MCM
; keys, including extended-range and menu-cell preload overrides. It does not
; alter the teleport radius, menu-cell preload, or uInterior Cell Buffer.
; Exterior gate proximity above queues only the destination arrival cell.

[Diagnostics]
; Startup-only, read-only preload tracing. The seven native observer hooks cover
; controlled OG 1.10.163 / VR 1.2.72 experiments; exact AE/NG 1.11.221 and
; 1.11.240 still record the plugin's safe gate enumeration and gate-request
; decisions.
; Leave OFF for clean timing runs.
; Requires a full game restart when changed.
bPreloadDiagnostics=0
